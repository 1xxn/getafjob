<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Upload your cover letter</title></head>
<body>
<!-- The drop zone only accepts files picked through its own file chooser; the upload must then be
     confirmed with "Confirm" before "Continue" becomes active. -->
<h1>Upload your cover letter</h1>
<div id="zone" role="presentation" style="width:420px;height:140px;border:1px dashed #999;display:grid;place-items:center">
  <span id="label">Upload file</span>
  <input type="file" id="cover" name="cover" required style="display:none">
</div>
<button type="button" id="confirm" hidden>Confirm</button>
<button type="button" id="next" disabled>Continue</button>
<script>
  const zone = document.getElementById("zone"), input = document.getElementById("cover");
  let armed = false;
  zone.addEventListener("click", () => { armed = true; input.click(); });
  input.addEventListener("change", () => {
    if (!armed || !input.files.length) return;  // files set directly are ignored by the zone
    document.getElementById("label").textContent = input.files[0].name;
    document.getElementById("confirm").hidden = false;
  });
  document.getElementById("confirm").addEventListener("click", () => { document.getElementById("next").disabled = false; });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SmartRecruiters Application - Delivery Hero</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 30px auto; padding: 0 20px; }
    .field { margin: 16px 0; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input[type=text], input[type=email], input[type=tel] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button[type=submit] { background: #22c55e; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Lead Infrastructure Engineer</h1>
  <p>Delivery Hero · Berlin, Germany</p>
  <form id="sr-form" action="/submit" method="post" novalidate>
    <div class="field">
      <label for="first_name">First Name *</label>
      <input id="first_name" name="first_name" type="text" required>
    </div>
    <div class="field">
      <label for="last_name">Last Name *</label>
      <input id="last_name" name="last_name" type="text" required>
    </div>
    <div class="field">
      <label for="email">Email *</label>
      <input id="email" name="email" type="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone *</label>
      <input id="phone" name="phone" type="tel" required>
    </div>
    <div class="field">
      <label for="resume">Resume / CV *</label>
      <input id="resume" name="resume" type="file" required>
    </div>
    <div class="field">
      <label><input id="privacy" type="checkbox" name="privacy" required> I agree to the privacy policy of SmartRecruiters and Delivery Hero *</label>
    </div>
    <div id="errors"></div>
    <button type="submit" id="btn-submit">Submit application</button>
  </form>
  <script>
    document.getElementById('sr-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const data = {
        first_name: f.first_name.value,
        last_name: f.last_name.value,
        email: f.email.value,
        phone: f.phone.value,
        resume: f.resume.files[0]?.name || '',
        privacy: f.privacy.checked
      };
      if (!data.first_name || !data.last_name || !data.email || !data.phone || !data.resume || !data.privacy) {
        document.getElementById('errors').innerHTML = '<p style="color:red">All fields marked with * are required.</p>';
        return;
      }
      await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      document.body.innerHTML = '<h2>Thank you for your application!</h2><p>Your application was successfully received.</p>';
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Backend Engineer - Dead Submit</title>
<style>.field{margin:12px 0}</style></head>
<body>
<!-- Dead submit: the submit handler swallows the event without sending a request, mutating the DOM or
     navigating. After one retry the engine parks the run with a screenshot. -->
<h1>Backend Engineer</h1>
<form id="app" novalidate>
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <button type="submit" id="send">Submit application</button>
</form>
<script>
  document.getElementById("app").addEventListener("submit", (e) => {
    e.preventDefault();
    window.deadSubmitClicks = (window.deadSubmitClicks || 0) + 1;
  });
</script>
</body>
</html>

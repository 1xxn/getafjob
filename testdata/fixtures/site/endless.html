<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Weitere Angaben</title></head>
<body>
<!-- A form that always sends to one more page (threat D2 in docs/security.md): the engine must park, not loop. -->
<h2>Weitere Angaben</h2>
<form id="more">
  <div><label>Vorname* <input name="vorname" required></label></div>
  <button type="submit">Weiter</button>
</form>
<script>
  document.getElementById('more').addEventListener('submit', (e) => {
    e.preventDefault();
    const n = Number(new URLSearchParams(location.search).get('page') || '1');
    location.href = '/endless.html?page=' + (n + 1);
  });
</script>
</body>
</html>

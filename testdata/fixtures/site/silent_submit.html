<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Backend Engineer - Silent Submit</title>
<style>.field{margin:12px 0}</style></head>
<body>
<!-- Silent submit: the form posts over fetch and disables the button without navigating or rendering a
     confirmation heading. The engine records the network effect as submitted (unconfirmed). -->
<h1>Backend Engineer</h1>
<form id="app" novalidate>
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <button type="submit" id="send">Submit application</button>
</form>
<script>
  document.getElementById("app").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = document.getElementById("send");
    btn.disabled = true;
    await fetch("/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ first_name: f.first_name.value, last_name: f.last_name.value, email: f.email.value, form: "silent_submit" }),
    });
  });
</script>
</body>
</html>

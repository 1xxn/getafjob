<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply - reCAPTCHA Test Key</title>
<style>
  .field{margin:12px 0}
  .g-recaptcha{width:304px;height:78px;border:1px solid #d3d3d3;display:flex;align-items:center;padding:0 12px}
</style></head>
<body>
<!-- reCAPTCHA v2 public test sitekey (6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI): counts as solved only when
     g-recaptcha-response contains a token. -->
<h1>Distributed Systems Engineer</h1>
<form id="app" novalidate>
  <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI">
    <iframe title="reCAPTCHA" width="300" height="74" src="about:blank#recaptcha/api2/anchor" style="border:0"></iframe>
    <textarea id="g-recaptcha-response" name="g-recaptcha-response" style="display:none"></textarea>
  </div>
  <div id="errors"></div>
  <button type="submit">Submit application</button>
</form>
<script>
  document.getElementById("app").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const token = document.getElementById("g-recaptcha-response").value;
    if (!token) {
      document.getElementById("errors").innerHTML = '<div role="alert">Please complete the reCAPTCHA</div>';
      return;
    }
    await fetch("/submit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ first_name: f.first_name.value, last_name: f.last_name.value, email: f.email.value, recaptcha: token }),
    });
    document.body.innerHTML = "<h1>Thank you for applying!</h1>";
  });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Dialogs</title></head>
<body>
<h1>Your application</h1>
<button id="save" type="button" onclick="alert('Draft saved'); document.getElementById('state').textContent = 'saved'">Save draft</button>
<button id="withdraw" type="button" onclick="window.withdrawn = confirm('Withdraw your application?'); document.getElementById('state').textContent = 'asked'">Withdraw</button>
<p id="state">open</p>
<script>addEventListener("beforeunload", (e) => { e.preventDefault(); });</script>
</body>
</html>

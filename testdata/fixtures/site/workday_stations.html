<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Workday Multi-Station Application</title>
  <style>
    body { font-family: sans-serif; max-width: 750px; margin: 30px auto; padding: 0 20px; }
    .field { margin: 14px 0; }
    label { display: block; font-weight: bold; margin-bottom: 4px; }
    input[type=text], input[type=email], textarea { width: 100%; padding: 8px; border: 1px solid #aaa; border-radius: 4px; box-sizing: border-box; }
    .step-box { border: 1px solid #ddd; padding: 20px; border-radius: 6px; margin-bottom: 20px; }
    .station-entry { border: 1px solid #e0e0e0; padding: 14px; border-radius: 4px; margin-bottom: 12px; background: #fafafa; }
    .btn-add { background: #f0fdf4; border: 1px solid #86efac; color: #16a34a; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; margin-bottom: 16px; }
    .btn-primary { background: #0056b3; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Candidate Portal - Acme Enterprise</h1>

  <!-- Step 1: Personal Info -->
  <div id="step-1" class="step-box">
    <h2>1. Contact Information</h2>
    <div class="field"><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
    <div class="field"><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
    <div class="field"><label for="email">Email Address *</label><input id="email" name="email" type="email" required></div>
    <div class="field"><label for="resume">Resume / CV *</label><input id="resume" name="resume" type="file" required></div>
    <button type="button" class="btn-primary" id="btn-next-1">Save and Continue</button>
  </div>

  <!-- Step 2: My Experience & Education -->
  <div id="step-2" class="step-box" style="display:none;">
    <h2>2. Work Experience & Education</h2>
    
    <fieldset id="section-experience">
      <legend>Work Experience</legend>
      <div id="exp-container">
        <div class="station-entry" id="work-0">
          <div class="field"><label for="job_title_0">Job Title *</label><input id="job_title_0" name="work_experience[0].title" required></div>
          <div class="field"><label for="company_0">Company *</label><input id="company_0" name="work_experience[0].company" required></div>
          <div class="field"><label for="location_0">Location</label><input id="location_0" name="work_experience[0].location"></div>
          <div class="field"><label for="from_0">From *</label><input id="from_0" name="work_experience[0].from" required></div>
          <div class="field"><label for="to_0">To</label><input id="to_0" name="work_experience[0].to"></div>
        </div>
      </div>
      <button type="button" class="btn-add" id="btn-add-exp">+ Add Another</button>
    </fieldset>

    <fieldset id="section-education">
      <legend>Education</legend>
      <div id="edu-container">
        <div class="station-entry" id="edu-0">
          <div class="field"><label for="school_0">School or University *</label><input id="school_0" name="education[0].school" required></div>
          <div class="field"><label for="degree_0">Degree *</label><input id="degree_0" name="education[0].degree" required></div>
          <div class="field"><label for="field_0">Field of Study</label><input id="field_0" name="education[0].major"></div>
        </div>
      </div>
      <button type="button" class="btn-add" id="btn-add-edu">+ Add Another</button>
    </fieldset>

    <button type="button" class="btn-primary" id="btn-next-2">Save and Continue</button>
  </div>

  <!-- Step 3: Review & Submit -->
  <div id="step-3" class="step-box" style="display:none;">
    <h2>3. Review and Submit</h2>
    <div id="review-summary"></div>
    <div class="field">
      <label><input id="confirm-chk" type="checkbox" required> I confirm all information provided is accurate *</label>
    </div>
    <button type="button" class="btn-primary" id="btn-submit">Submit Application</button>
  </div>

  <script>
    let expCount = 1;
    let eduCount = 1;

    document.getElementById('btn-add-exp').addEventListener('click', () => {
      const idx = expCount++;
      const div = document.createElement('div');
      div.className = 'station-entry';
      div.id = `work-${idx}`;
      div.innerHTML = `
        <div class="field"><label for="job_title_${idx}">Job Title *</label><input id="job_title_${idx}" name="work_experience[${idx}].title" required></div>
        <div class="field"><label for="company_${idx}">Company *</label><input id="company_${idx}" name="work_experience[${idx}].company" required></div>
        <div class="field"><label for="location_${idx}">Location</label><input id="location_${idx}" name="work_experience[${idx}].location"></div>
        <div class="field"><label for="from_${idx}">From *</label><input id="from_${idx}" name="work_experience[${idx}].from" required></div>
        <div class="field"><label for="to_${idx}">To</label><input id="to_${idx}" name="work_experience[${idx}].to"></div>
      `;
      document.getElementById('exp-container').appendChild(div);
    });

    document.getElementById('btn-add-edu').addEventListener('click', () => {
      const idx = eduCount++;
      const div = document.createElement('div');
      div.className = 'station-entry';
      div.id = `edu-${idx}`;
      div.innerHTML = `
        <div class="field"><label for="school_${idx}">School or University *</label><input id="school_${idx}" name="education[${idx}].school" required></div>
        <div class="field"><label for="degree_${idx}">Degree *</label><input id="degree_${idx}" name="education[${idx}].degree" required></div>
        <div class="field"><label for="field_${idx}">Field of Study</label><input id="field_${idx}" name="education[${idx}].major"></div>
      `;
      document.getElementById('edu-container').appendChild(div);
    });

    document.getElementById('btn-next-1').addEventListener('click', () => {
      document.getElementById('step-1').style.display = 'none';
      document.getElementById('step-2').style.display = 'block';
    });

    document.getElementById('btn-next-2').addEventListener('click', () => {
      document.getElementById('step-2').style.display = 'none';
      document.getElementById('step-3').style.display = 'block';
    });

    document.getElementById('btn-submit').addEventListener('click', async () => {
      const exps = [];
      for (let i = 0; i < expCount; i++) {
        const c = document.getElementById(`company_${i}`);
        const t = document.getElementById(`job_title_${i}`);
        if (c && t && c.value) exps.push({ company: c.value, title: t.value });
      }
      const data = {
        name: document.getElementById('first_name').value + ' ' + document.getElementById('last_name').value,
        email: document.getElementById('email').value,
        resume: document.getElementById('resume').files[0]?.name || '',
        experiences: exps
      };
      await fetch('/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
      document.body.innerHTML = '<h2>Application Complete!</h2><p>Thank you for submitting your application.</p>';
    });
  </script>
</body>
</html>

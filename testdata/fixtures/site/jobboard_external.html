<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Senior Backend Developer (m/w/d) - Stellenanzeige</title>
</head>
<body>
<h1>Senior Backend Developer (m/w/d)</h1>
<p>Die Stellenbeschreibung wird auf der Seite unseres Partners bereitgestellt.</p>
<p><a id="ext" href="/greenhouse_header_submit.html" target="_blank" rel="noopener">Externe Seite öffnen</a></p>

<bahf-cookie-disclaimer-dpl3></bahf-cookie-disclaimer-dpl3>
<script>
(() => {
  const host = document.querySelector("bahf-cookie-disclaimer-dpl3");
  const root = host.attachShadow({ mode: "open" });
  root.innerHTML = `
    <style>
      :host { position: fixed; inset: 0; z-index: 9999; background: rgba(0, 0, 0, 0.6); display: grid; place-items: center; }
      .modal { background: #fff; padding: 24px; max-width: 480px; }
    </style>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Datenschutz">
      <p>Wir verwenden Cookies und ähnliche Technologien.</p>
      <button type="button" id="accept">Alle Cookies akzeptieren</button>
      <button type="button" id="decline">Alle Cookies ablehnen</button>
    </div>
  `;
  root.getElementById("accept").addEventListener("click", () => {
    document.cookie = "consent=accepted; path=/";
    host.remove();
  });
  root.getElementById("decline").addEventListener("click", () => {
    document.cookie = "consent=declined; path=/";
    host.remove();
  });
})();
</script>
</body>
</html>

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: getafjob

before:
  hooks:
    - go mod verify

builds:
  - id: getafjob
    main: ./cmd/getafjob
    binary: getafjob
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/1xxn/getafjob/internal/platform/buildinfo.Version={{ .Version }}
      - -X github.com/1xxn/getafjob/internal/platform/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/1xxn/getafjob/internal/platform/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  disable: true # release notes come from git-cliff

release:
  github:
    owner: 1xxn
    name: getafjob
  draft: true
  prerelease: auto

name: Feature
description: A new capability or a change in behaviour
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which need does this address? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should getafjob do? Mention guard rails it touches (provenance, single submit, sandbox, human checks).
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [identity, profile, discovery, matching, application, runner, tracking, notify, assist, ai, web, platform, deploy, ci]
    validations:
      required: true

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  # A push to main gets a group of its own commit: a newer push never drops a waiting run of an older one, so every
  # main commit gets all its checks. Pull requests share one group per branch and cancel outdated runs.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GORELEASER_VERSION: v2.20.0

jobs:
  verify:
    name: verify
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          key: verify
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy
        run: go mod tidy -diff
      - name: egress build module (verify, tidy)
        working-directory: deploy/egress
        run: go mod verify && go mod tidy -diff
      - name: gofmt
        run: |
          out="$(gofmt -l -s .)"
          if [ -n "$out" ]; then echo "::error::not gofmt-ed"; echo "$out"; exit 1; fi
      - name: generated code is up to date (buf, oapi-codegen, templ, sqlc)
        run: |
          go tool buf generate
          go generate ./...
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then echo "::error::untracked generated files"; echo "$untracked"; exit 1; fi
      - name: buf lint
        run: go tool buf lint
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: go tool buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"
      - uses: ./.github/actions/go
        with:
          key: verify
          save: "true"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          key: lint
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags browser,e2e # govet included: no separate go vet
      - uses: ./.github/actions/go
        with:
          key: lint
          save: "true"

  vuln:
    name: govulncheck
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          key: vuln
      - run: go tool govulncheck ./...

  # Shards in parallel: internal/web, the PostgreSQL adapters (testcontainers), everything else, and the
  # performance budgets (no race detector).
      - uses: ./.github/actions/go
        with:
          key: vuln
          save: "true"

  test-linux:
    name: test (linux, ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [web, db, rest, budget]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          key: test-${{ matrix.shard }}
      - name: unit + integration tests (race, shuffled)
        if: matrix.shard != 'budget'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          # shellcheck disable=SC2046 # one argument per package
          go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic $(.github/scripts/test-packages.sh "$SHARD")
          go tool cover -func=coverage.out | tail -n 1
      - name: performance budgets (no race detector)
        if: matrix.shard == 'budget'
        run: go tool task test:budget
      - uses: ./.github/actions/go
        with:
          key: test-${{ matrix.shard }}
          save: "true"

  fuzz-plan:
    name: fuzz (plan)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "packages=$(.github/scripts/fuzz-packages.sh --json)" >> "$GITHUB_OUTPUT"

  # One job per package with fuzz targets, in parallel to the tests; the nightly corpus seeds each run.
  fuzz-run:
    name: fuzz (${{ matrix.package }})
    needs: fuzz-plan
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.fuzz-plan.outputs.packages) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          key: fuzz
      - name: nightly corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.package }}-
      - name: every fuzz target of the package for 20 seconds
        env:
          PACKAGE: ${{ matrix.package }}
        run: .github/scripts/fuzz-all.sh 20s "$PACKAGE"
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          retention-days: 14

  # The required check: green when every fuzz job passed or the change is documentation only.
      - uses: ./.github/actions/go
        with:
          key: fuzz
          save: "true"

  fuzz:
    name: fuzz
    needs: [changes, fuzz-plan, fuzz-run]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: all fuzz jobs passed
        env:
          PLAN: ${{ needs.fuzz-plan.result }}
          RUN: ${{ needs.fuzz-run.result }}
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
        run: |
          test "$CHANGES" = success
          if [ "$GO" != true ]; then exit 0; fi # documentation only
          test "$PLAN" = success && test "$RUN" = success

  test-other:
    name: test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go
        with:
          key: test
      - name: build (home runner and all roles)
        run: go build -o bin/ ./cmd/getafjob
      - name: unit tests
        run: go test -short -race -shuffle=on ./...

  # The required check for the test matrices (a skipped matrix job reports no usable name): green when every shard
  # and platform passed, or the change is documentation only.
      - uses: ./.github/actions/go
        with:
          key: test
          save: "true"

  tests:
    name: tests
    needs: [changes, test-linux, test-other]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          GO: ${{ needs.changes.outputs.go }}
          LINUX: ${{ needs.test-linux.result }}
          OTHER: ${{ needs.test-other.result }}
        run: |
          test "$CHANGES" = success
          if [ "$GO" != true ]; then exit 0; fi # documentation only
          test "$LINUX" = success && test "$OTHER" = success

  # Which parts a pull request needs. Pushes to main run the Go checks here; the stack and the release snapshot run
  # in main.yml after the merge. A skipped job counts as passed for the ruleset.
  changes:
    name: changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      go: ${{ steps.diff.outputs.go }}
      stack: ${{ steps.diff.outputs.stack }}
      release: ${{ steps.diff.outputs.release }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            printf 'go=true\nstack=false\nrelease=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          echo "$files"
          has() { echo "$files" | grep -qE "$1" && echo true || echo false; }
          {
            # Anything but documentation runs the Go checks.
            echo "go=$(echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*)$' && echo true || echo false)"
            # Images and what runs inside them: build, scan, browser fixtures, Compose rehearsals.
            echo "stack=$(has '^(Dockerfile|\.dockerignore|go\.(mod|sum)|deploy/.*|internal/runner/.*|testdata/fixtures/.*|\.github/workflows/stack\.yml)$')"
            echo "release=$(has '^(\.goreleaser\.ya?ml|Dockerfile|go\.(mod|sum)|\.github/workflows/(main|release)\.yml)$')"
          } >> "$GITHUB_OUTPUT"

  stack-run:
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/stack.yml
    with:
      e2e: false
      write-cache: false

  # The required check for the stack: passed when it ran green or was not needed.
  stack:
    name: stack
    needs: [changes, stack-run]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          STACK: ${{ needs.stack-run.result }}
        run: test "$CHANGES" = success && { test "$STACK" = success || test "$STACK" = skipped; }

  release-snapshot:
    name: release (snapshot)
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release builds never use caches
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: auditor
          online-audits: false

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: conventional commits, single author identity, no generator trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-commits.sh "$BASE" "$HEAD"

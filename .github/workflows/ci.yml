name: CI

on:
  pull_request:
  merge_group: # the merge queue tests each pull request on top of main before it lands
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GORELEASER_VERSION: v2.20.0

jobs:
  verify:
    name: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy
        run: go mod tidy -diff
      - name: egress build module (verify, tidy)
        working-directory: deploy/egress
        run: go mod verify && go mod tidy -diff
      - name: gofmt
        run: |
          out="$(gofmt -l -s .)"
          if [ -n "$out" ]; then echo "::error::not gofmt-ed"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./... && go vet -tags browser ./... && go vet -tags e2e ./internal/e2e/...
      - name: generated code is up to date (buf, oapi-codegen, templ, sqlc)
        run: |
          go tool buf generate
          go generate ./...
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then echo "::error::untracked generated files"; echo "$untracked"; exit 1; fi
      - name: buf lint
        run: go tool buf lint
      - name: buf breaking
        if: github.event_name != 'push'
        run: go tool buf breaking --against "https://github.com/${GITHUB_REPOSITORY}.git#branch=main"

  lint:
    name: lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --build-tags browser

  vuln:
    name: govulncheck
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool govulncheck ./...

  test-linux:
    name: test (linux)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: unit + integration tests (race, shuffled)
        run: go test -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -n 1
      - name: performance budgets (no race detector)
        run: go tool task test:budget

  fuzz-plan:
    name: fuzz (plan)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "packages=$(.github/scripts/fuzz-packages.sh --json)" >> "$GITHUB_OUTPUT"

  # One job per package with fuzz targets, in parallel to the tests; the nightly corpus seeds each run.
  fuzz-run:
    name: fuzz (${{ matrix.package }})
    needs: fuzz-plan
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.fuzz-plan.outputs.packages) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: nightly corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.package }}-
      - name: every fuzz target of the package for 20 seconds
        env:
          PACKAGE: ${{ matrix.package }}
        run: .github/scripts/fuzz-all.sh 20s "$PACKAGE"
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          retention-days: 14

  # The required check: green only when every fuzz job passed.
  fuzz:
    name: fuzz
    needs: [fuzz-plan, fuzz-run]
    if: always()
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: all fuzz jobs passed
        env:
          PLAN: ${{ needs.fuzz-plan.result }}
          RUN: ${{ needs.fuzz-run.result }}
        run: test "$PLAN" = success && test "$RUN" = success

  test-other:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build (home runner and all roles)
        run: go build -o bin/ ./cmd/getafjob
      - name: unit tests
        run: go test -short -race -shuffle=on ./...

  browser:
    name: browser fixtures (runner image)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # job builds an image
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          tags: getafjob-runner:dev
          load: true
          cache-from: type=gha,scope=runner
          # Only main writes the cache, so a pull request cannot place layers that main builds from.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=runner,mode=max' || '' }}
      - name: browser tests inside the runner image (sandbox on, seccomp profile)
        run: go tool task test:browser:run

  changes:
    name: changes
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A pull request that changes only documentation skips the e2e journeys; any other file runs them, and main
      # always does. A skipped job counts as passed for the ruleset.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE...$HEAD")"
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/.*|.*\.md|LICENSE|\.github/ISSUE_TEMPLATE/.*)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: e2e journeys (dev stack)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # zizmor: no Go cache in a job whose results gate main (cache poisoning)
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The stack images reuse the layer cache of the images job. Only pushes to main write it (images job), so a pull
      # request cannot put layers into the cache that main builds from.
      - name: build the app image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          tags: getafjob:dev
          load: true
          cache-from: type=gha,scope=app
      - name: build the runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          tags: getafjob-runner:dev
          load: true
          cache-from: type=gha,scope=runner
      - name: build the egress image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: egress
          tags: getafjob-egress:dev
          load: true
          cache-from: type=gha,scope=egress
      - name: start the dev stack
        run: |
          go tool task dev:secrets
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml --profile dev up -d --no-build --wait --wait-timeout 300
      - name: demo data on the fixture site
        run: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml exec -T serve
          /usr/local/bin/getafjob admin demo -jobs 50 -fixtures http://fixtures:8080
      - name: journeys in the runner image (fresh invited user, sandbox on)
        run: go tool task test:e2e
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: bin/e2e/out
          if-no-files-found: ignore
          retention-days: 7
      - name: stack logs
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml --profile dev logs --no-color --tail 200

  images:
    name: image (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [app, runner, egress]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          tags: getafjob-${{ matrix.target }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.target }}
          # Write the layer cache from main only; pull requests read it (the e2e job builds from it too).
          cache-to: ${{ github.event_name == 'push' && format('type=gha,scope={0},mode=max', matrix.target) || '' }}
      - name: trivy (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: getafjob-${{ matrix.target }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  compose:
    name: compose stack
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: start every service and wait until healthy
        run: go tool task dev:up
      - name: smoke test through caddy and the egress policy
        run: deploy/smoke.sh
      - name: "rehearsal: backup and restore into a fresh stack"
        run: deploy/test-restore.sh
      - name: "rehearsal: deploy and automatic rollback"
        run: deploy/test-deploy.sh
      - name: logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: stop
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  release-snapshot:
    name: release (snapshot)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # release builds never use caches
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          persona: auditor
          online-audits: false

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: conventional commits, single author identity, no generator trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-commits.sh "$BASE" "$HEAD"

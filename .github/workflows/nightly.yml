name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz-plan:
    name: fuzz (plan)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "packages=$(.github/scripts/fuzz-packages.sh --json)" >> "$GITHUB_OUTPUT"

  # Every target for 10 minutes, one job per package; the corpus is kept from night to night and seeds the PR runs.
  fuzz:
    name: fuzz long (${{ matrix.package }})
    needs: fuzz-plan
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.fuzz-plan.outputs.packages) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: restore corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.package }}-
      - name: every fuzz target of the package for 10 minutes
        env:
          PACKAGE: ${{ matrix.package }}
        run: .github/scripts/fuzz-all.sh 10m "$PACKAGE"
      - name: save corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ matrix.package }}-${{ github.run_id }}
      - name: keep crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          retention-days: 14

  sources:
    name: job sources and catalog (real APIs, read-only)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: one board per source, then every catalog board
        env:
          GETAFJOB_NETWORK_TESTS: "1"
        run: go test -count=1 -timeout 40m -run 'TestNetwork|TestCatalog' -v ./internal/discovery/adapters/sources/

  bench:
    name: benchmarks vs main
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: run benchmarks (10 samples)
        run: go test -short -run='^$' -bench=. -benchmem -count=10 ./... | tee bench.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ github.sha }}
          path: bench.txt
          retention-days: 90

  e2e:
    name: e2e (compose)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go tool task dev:up
      - run: deploy/smoke.sh
      - name: e2e tests
        run: go test -tags e2e -count=1 ./...
      - name: logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - if: always()
        run: docker compose -f deploy/compose.yaml down -v

  network:
    name: network (read-only, opt-in)
    # Reads real job sources and forms; never fills or submits. Enable with the repository variable
    # GETAFJOB_NETWORK_TESTS=1.
    if: vars.GETAFJOB_NETWORK_TESTS == '1'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: network tests
        env:
          GETAFJOB_NETWORK: "1"
        run: go test -tags network -count=1 -run Network ./...

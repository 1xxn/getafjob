name: Images

# Every push to main publishes signed images tagged "main" and "sha-<commit>" (staging deploys pick them up).
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: images-main
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # keyless signing (cosign) and attestations via GitHub OIDC
      attestations: write # build provenance attestations
    uses: ./.github/workflows/images-publish.yml
    with:
      version: main-${{ github.sha }}
      tags: type=raw,value=main

  deploy-staging:
    name: deploy (staging)
    needs: [publish]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      version: main-${{ github.sha }}
    secrets:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}

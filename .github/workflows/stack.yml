name: Stack

# Builds the app, runner and egress images once, scans them and hands them to the jobs that need the stack as one
# artifact: browser fixtures, the e2e journeys and the Compose rehearsals. Called after every push to main
# (main.yml) and by pull requests that change the images (ci.yml); start it by hand for any branch with
# `gh workflow run stack.yml --ref <branch>`.
on:
  workflow_call:
    inputs:
      e2e:
        description: Run the e2e journeys
        type: boolean
        default: true
      write-cache:
        description: Write the image layer cache (main only)
        type: boolean
        default: false
  workflow_dispatch:

permissions: {}

concurrency:
  # Pushes to main: one group per commit, never cancelled. Pull requests and manual runs: the newest run per ref.
  group: stack-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  images:
    name: images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          tags: getafjob:dev
          load: true
          cache-from: type=gha,scope=app
          # Only main writes the cache, so a pull request cannot place layers that main builds from.
          cache-to: ${{ inputs.write-cache && 'type=gha,scope=app,mode=max' || '' }}
      - name: build runner
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          tags: getafjob-runner:dev
          load: true
          cache-from: type=gha,scope=runner
          cache-to: ${{ inputs.write-cache && 'type=gha,scope=runner,mode=max' || '' }}
      - name: build egress
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: egress
          tags: getafjob-egress:dev
          load: true
          cache-from: type=gha,scope=egress
          cache-to: ${{ inputs.write-cache && 'type=gha,scope=egress,mode=max' || '' }}
      - name: trivy app (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: getafjob:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - name: trivy runner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: getafjob-runner:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true
      - name: trivy egress
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: getafjob-egress:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true
      - name: save
        run: docker save getafjob:dev getafjob-runner:dev getafjob-egress:dev | zstd -T0 -3 -o images.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.zst
          retention-days: 1
          compression-level: 0

  browser:
    name: browser fixtures
    needs: images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # results gate main: no Go cache (cache poisoning)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: load images
        run: zstd -dc images.tar.zst | docker load
      - name: browser tests inside the runner image (sandbox on, seccomp profile)
        run: go tool task test:browser:run

  e2e:
    name: e2e journeys
    if: inputs.e2e || github.event_name == 'workflow_dispatch'
    needs: images
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # results gate main: no Go cache (cache poisoning)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: load images
        run: zstd -dc images.tar.zst | docker load && rm images.tar.zst
      - name: start the dev stack
        run: |
          go tool task dev:secrets
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml --profile dev up -d --no-build --wait --wait-timeout 300
      # The planner queues nothing for the demo users; the journeys start their runs on fixture jobs of their own.
      - name: demo data on the fixture site
        run: >-
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml exec -T serve
          /usr/local/bin/getafjob admin demo -jobs 50 -fixtures http://fixtures:8080 -autonomy suggest
      - name: journeys in the runner image (fresh invited user, sandbox on)
        run: go tool task test:e2e
      - name: screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: bin/e2e/out
          if-no-files-found: ignore
          retention-days: 7
      - name: stack logs
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml --profile dev logs --no-color --tail 200

  compose:
    name: compose stack
    needs: images
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # results gate main: no Go cache (cache poisoning)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - name: load images
        run: zstd -dc images.tar.zst | docker load && rm images.tar.zst
      - name: start every service and wait until healthy
        run: |
          go tool task dev:secrets
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml --profile dev up -d --no-build --wait --wait-timeout 300
      - name: smoke test through caddy and the egress policy
        run: deploy/smoke.sh
      - name: "rehearsal: backup and restore into a fresh stack"
        run: deploy/test-restore.sh
      - name: "rehearsal: deploy and automatic rollback"
        run: deploy/test-deploy.sh
      - name: logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color
      - name: stop
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

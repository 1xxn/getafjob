name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  branch_protection_rule:

permissions: {}

concurrency:
  # A push to main gets a group of its own commit: a newer push never drops a waiting run of an older one, so every
  # main commit gets all its checks. Pull requests share one group per branch and cancel outdated runs.
  group: scorecard-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      id-token: write # publish results to the OpenSSF Scorecard API
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif

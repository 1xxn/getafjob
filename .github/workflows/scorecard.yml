name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 2"
  branch_protection_rule:

permissions: {}

concurrency:
  # A push to main gets a group of its own commit: a newer push never drops a waiting run of an older one, so every
  # main commit gets all its checks. Pull requests share one group per branch and cancel outdated runs.
  group: scorecard-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write # upload results to code scanning
      id-token: write # publish results to the OpenSSF Scorecard API
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif

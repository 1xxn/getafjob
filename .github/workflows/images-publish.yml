name: Publish images

# Reusable: builds app, runner and egress for amd64 and arm64, pushes them to GHCR, signs them keyless with
# cosign and attaches build provenance. Called by images.yml (main → staging) and release.yml (tags).
on:
  workflow_call:
    inputs:
      version:
        description: Version baked into the binary (e.g. v0.1.0 or main-<sha>)
        required: true
        type: string
      tags:
        description: Extra image tags, one per line (metadata-action syntax)
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: publish (${{ matrix.target }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push images to GHCR
      id-token: write # keyless signing (cosign) and attestations via GitHub OIDC
      attestations: write # build provenance attestations
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: app
            image: ghcr.io/1xxn/getafjob
          - target: runner
            image: ghcr.io/1xxn/getafjob-runner
          - target: egress
            image: ghcr.io/1xxn/getafjob-egress
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: commit date
        id: meta-date
        run: echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,format=long
            ${{ inputs.tags }}
          labels: |
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.meta-date.outputs.date }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: sign (keyless, GitHub OIDC)
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

# All commands for development and CI. Run: go tool task <name>   (list: go tool task --list)
version: "3"

vars:
  # Same version as in .github/workflows/ci.yml (Renovate keeps both in sync).
  GOLANGCI_LINT_VERSION: v2.15.0
  BIN: bin/getafjob{{exeExt}}
  COMPOSE: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml
  RUNNER_IMAGE: getafjob-runner:dev

tasks:
  default:
    cmds:
      - go tool task --list
    silent: true

  check:
    desc: Everything CI checks locally before a PR (fmt, vet, lint, tests with race, govulncheck, generate diff)
    cmds:
      - task: fmt:check
      - task: tidy:check
      - task: vet
      - task: lint
      - task: test
      - task: vuln
      - task: generate:check

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w -s .

  fmt:check:
    desc: Fail if any Go file is not gofmt-ed
    cmds:
      - cmd: |
          out="$(gofmt -l -s .)"
          if [ -n "$out" ]; then echo "not gofmt-ed:"; echo "$out"; exit 1; fi

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy
    cmds:
      - go mod tidy -diff

  vet:
    cmds:
      - go vet ./... && go vet -tags e2e ./internal/e2e/...

  lint:
    desc: golangci-lint (pinned, runs in Docker, no local install)
    cmds:
      - >-
        docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src
        -v getafjob-golangci-cache:/root/.cache
        golangci/golangci-lint:{{.GOLANGCI_LINT_VERSION}} golangci-lint run --build-tags browser ./...

  test:
    desc: Unit + integration tests (integration needs Docker) with race detector and shuffled order
    cmds:
      - go test -race -shuffle=on ./...

  test:short:
    desc: Unit tests only (no Docker)
    cmds:
      - go test -short -shuffle=on ./...

  test:budget:
    desc: "Performance budgets without the race detector: page p95 under 150 ms on 2000 postings, JS and CSS under 100 KB gzip"
    cmds:
      - go test -count=1 -run 'TestJobListLatency|TestAssetBudget' ./internal/web/

  test:load:
    desc: "Run the concurrent load test (SLO: p95 < 200 ms on 2000 postings)"
    cmds:
      - go test -v -run TestConcurrentLoadSLO ./internal/web/...

  test:browser:
    desc: Browser fixture suite inside the runner image (real Chromium with sandbox and seccomp profile)
    cmds:
      - task: image:runner
      - task: test:browser:run

  test:browser:run:
    desc: Run the browser tests in an already built runner image
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: '{{ARCH}}'
    cmds:
      - go test -c -tags browser -o bin/browser-tests/ ./internal/runner/...
      - >-
        docker run --rm --read-only --tmpfs /tmp:rw,size=512m --shm-size=512m
        --cap-drop ALL --security-opt no-new-privileges
        --security-opt seccomp=deploy/seccomp/chromium.json
        -v "{{.ROOT_DIR}}/bin/browser-tests:/tests:ro"
        -v "{{.ROOT_DIR}}/testdata:/testdata:ro"
        -e GETAFJOB_FIXTURES_DIR=/testdata/fixtures/site
        --entrypoint /bin/sh {{.RUNNER_IMAGE}} -c
        'set -e; for t in /tests/*.test; do echo "== $t"; "$t" -test.v -test.shuffle=on {{.CLI_ARGS}}; done'

  test:e2e:
    desc: >-
      End to end journeys against the running dev stack (dev:up and admin demo -autonomy suggest first): a fresh
      invited user, fresh fixture jobs for the journeys that start runs, the runner image's Chromium on the internal
      edge network, screenshots in bin/e2e/out
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: '{{ARCH}}'
    cmds:
      - go test -c -tags e2e -o bin/e2e/e2e.test ./internal/e2e
      - cmd: >-
          {{.COMPOSE}} exec -T caddy cat /data/caddy/pki/authorities/local/intermediate.crt
          > bin/e2e/caddy-intermediate.crt
      - cmd: mkdir -p bin/e2e/out && chmod 0777 bin/e2e/out
      # The test container joins edge (Caddy) and devtools (Mailpit, for the demo user's mail link).
      - cmd: >-
          invite="$({{.COMPOSE}} exec -T serve /usr/local/bin/getafjob admin invite
          -email "e2e-$(date +%s)@example.org" | head -n 1)" &&
          admin_invite="$({{.COMPOSE}} exec -T serve /usr/local/bin/getafjob admin invite -role admin
          -email "e2e-admin-$(date +%s)@example.org" | head -n 1)" &&
          jobs="$({{.COMPOSE}} exec -T serve /usr/local/bin/getafjob admin demo -jobs 0 -fresh 8
          -fixtures http://fixtures:8080 | sed -n 's/^fixture job //p' | paste -sd, -)" &&
          id="$(docker create --read-only --tmpfs /tmp:rw,size=512m --shm-size=512m
          --cap-drop ALL --security-opt no-new-privileges
          --security-opt seccomp=deploy/seccomp/chromium.json
          --network getafjob_edge
          -v "{{.ROOT_DIR}}/bin/e2e:/e2e"
          -e GETAFJOB_E2E_INVITE="$invite" -e GETAFJOB_E2E_ADMIN_INVITE="$admin_invite" -e GETAFJOB_E2E_DOCS="{{.DOCS}}" -e GETAFJOB_E2E_CA=/e2e/caddy-intermediate.crt -e GETAFJOB_E2E_OUT=/e2e/out
          -e GETAFJOB_E2E_MAILPIT=http://mailpit:8025 -e GETAFJOB_E2E_JOBS="$jobs"
          --entrypoint /e2e/e2e.test {{.RUNNER_IMAGE}} -test.v {{.CLI_ARGS}})" &&
          docker network connect getafjob_devtools "$id" &&
          { docker start -a "$id"; rc=$?; docker rm "$id" > /dev/null; exit $rc; }

  docs:screenshots:
    desc: Take the README screenshots from the demo data in English (dev stack with demo data running) into docs/images
    cmds:
      - task: test:e2e
        vars: { DOCS: "1", CLI_ARGS: "-test.run TestDocsScreenshots" }
      - for n in job-list job-detail approvals needs-input settings; do cp "bin/e2e/out/TestDocsScreenshots_$n.png" "docs/images/$n.png"; done

  vuln:
    desc: Known vulnerabilities in reachable code
    cmds:
      - go tool govulncheck ./...

  generate:
    desc: Run all code generators (buf, oapi-codegen, templ, sqlc)
    cmds:
      - go tool buf generate
      - go generate ./...

  generate:check:
    desc: Fail if generated code is out of date
    cmds:
      - task: generate
      - git diff --exit-code -- . ':(exclude)go.sum'
      - cmd: |
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then echo "untracked generated files:"; echo "$untracked"; exit 1; fi

  proto:lint:
    desc: buf lint and breaking-change check against main
    cmds:
      - go tool buf lint
      - go tool buf breaking --against '.git#branch=main'

  build:
    desc: Build the binary into bin/
    env:
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -o {{.BIN}} ./cmd/getafjob

  image:app:
    cmds:
      - docker build --target app -t getafjob:dev .
  image:runner:
    cmds:
      - docker build --target runner -t {{.RUNNER_IMAGE}} .
  image:egress:
    cmds:
      - docker build --target egress -t getafjob-egress:dev .
  images:
    desc: Build app, runner and egress images
    cmds:
      - task: image:app
      - task: image:runner
      - task: image:egress

  dev:secrets:
    desc: Create random development secrets in deploy/secrets (never used in production)
    status:
      - test -f deploy/secrets/db_password
      - test -f deploy/secrets/db_app_password
      - test -f deploy/secrets/master_key
      - test -f deploy/secrets/smtp_url
      - test -f deploy/secrets/runner_secret
      - test -f deploy/secrets/backup_password
    cmds:
      - go run ./internal/devsecrets

  dev:up:
    desc: Start the full stack locally (https://localhost:8443) and wait until every service is healthy
    deps: [dev:secrets]
    cmds:
      - '{{.COMPOSE}} --profile dev up -d --build --wait --wait-timeout 300'
      - '{{.COMPOSE}} ps'

  dev:down:
    cmds:
      - '{{.COMPOSE}} --profile dev down'

  dev:logs:
    cmds:
      - '{{.COMPOSE}} --profile dev logs -f {{.CLI_ARGS}}'

  obs:up:
    desc: Start the stack with observability (Prometheus, Tempo, Loki, Grafana on http://127.0.0.1:3000)
    deps: [dev:secrets]
    env:
      GETAFJOB_OTEL_ENDPOINT: http://otel-collector:4318
    cmds:
      - '{{.COMPOSE}} --profile dev --profile observability up -d --build --wait --wait-timeout 300'
      - '{{.COMPOSE}} ps'

  obs:down:
    desc: Stop the stack including the observability profile
    cmds:
      - '{{.COMPOSE}} --profile dev --profile observability down'

  obs:logs:
    desc: Tail logs including the observability profile
    cmds:
      - '{{.COMPOSE}} --profile dev --profile observability logs -f {{.CLI_ARGS}}'

  obs:load:
    desc: "Generate concurrent load on the local stack to populate Grafana dashboards (SLO: p95 < 200 ms)"
    cmds:
      - go run ./cmd/getafjob admin load-test -url https://localhost:8443 -insecure -users 10 -duration 15s

  backup:
    desc: Create an encrypted restic backup of PostgreSQL and blobs
    cmds:
      - deploy/backup.sh {{.CLI_ARGS}}

  restore:
    desc: Restore from an encrypted restic backup into PostgreSQL and blobs
    cmds:
      - deploy/restore.sh {{.CLI_ARGS}}

  test:restore:
    desc: Rehearse backup and restore into a fresh stack and verify with smoke test
    cmds:
      - deploy/test-restore.sh

  deploy:
    desc: Deploy the stack to staging or production with automated migration and health check
    cmds:
      - deploy/deploy.sh {{.CLI_ARGS}}

  rollback:
    desc: Roll back the stack to the previous or specified version
    cmds:
      - deploy/rollback.sh {{.CLI_ARGS}}

  test:deploy:
    desc: Rehearse deployment, health check, and automatic rollback on failure
    cmds:
      - deploy/test-deploy.sh

  release:snapshot:
    desc: goreleaser dry run (no publishing)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/src" -w /src goreleaser/goreleaser:v2.20.0 release --snapshot --clean

  hooks:
    desc: Install git hooks (lefthook)
    cmds:
      - go tool lefthook install

# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/HEAD/configuration-schema.json
package: apiv1
output: apiv1.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: false # the binary does not need the spec at runtime (keeps kin-openapi out of it)
output-options:
  skip-prune: false

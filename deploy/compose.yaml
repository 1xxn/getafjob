# getafjob local stack (the same services as production; deploy/compose.prod.yaml adds the server specifics).
#
#   go tool task dev:up      # creates dev secrets, builds images, starts everything, waits until healthy
#   open https://localhost:8443/healthz
#
# Networks: only caddy and egress reach the internet. Everything else sits on internal networks; the runner and
# the worker reach the web exclusively through the egress proxy, which blocks private networks and cloud metadata.
name: ${COMPOSE_PROJECT_NAME:-getafjob}

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

# serve and worker use the application role (row-level security applies); only migrate uses the owner.
x-app-env: &app-env
  GETAFJOB_DATABASE_URL: postgres://getafjob_app@postgres:5432/getafjob?sslmode=disable
  GETAFJOB_DATABASE_PASSWORD_FILE: /run/secrets/db_app_password
  GETAFJOB_PUBLIC_URL: ${GETAFJOB_PUBLIC_URL:-https://localhost:8443}
  GETAFJOB_LOG_FORMAT: json
  GETAFJOB_LOG_LEVEL: ${GETAFJOB_LOG_LEVEL:-info}
  GETAFJOB_OTEL_ENDPOINT: ${GETAFJOB_OTEL_ENDPOINT:-}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: getafjob
      POSTGRES_DB: getafjob
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql
      - /tmp
    read_only: true
    security_opt: [no-new-privileges:true]
    shm_size: 256mb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getafjob -d getafjob"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    <<: *hardening
    image: getafjob:dev
    build: { context: .., target: app }
    command: [migrate]
    restart: "no"
    environment:
      <<: *app-env
      GETAFJOB_DATABASE_URL: postgres://getafjob@postgres:5432/getafjob?sslmode=disable
      GETAFJOB_DATABASE_PASSWORD_FILE: /run/secrets/db_password
      GETAFJOB_DATABASE_APP_PASSWORD_FILE: /run/secrets/db_app_password
    secrets: [db_password, db_app_password]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [backend]

  serve:
    <<: *hardening
    image: getafjob:dev
    pull_policy: never
    command: [serve]
    environment:
      <<: *app-env
      GETAFJOB_HTTP_ADDR: ":8080"
      GETAFJOB_SMTP_URL_FILE: /run/secrets/smtp_url
      GETAFJOB_MASTER_KEY_FILE: /run/secrets/master_key
      GETAFJOB_BLOB_URL: file:///var/lib/getafjob/blobs
      GETAFJOB_MAIL_FROM: ${GETAFJOB_MAIL_FROM:-getafjob@localhost}
      # Runner gateway, reachable only on the internal gateway network.
      GETAFJOB_GATEWAY_ADDR: ":8090"
      GETAFJOB_RUNNER_SECRET_FILE: /run/secrets/runner_secret
      GETAFJOB_EGRESS_PROXY: http://egress:4750
    secrets: [db_app_password, master_key, smtp_url, runner_secret]
    volumes:
      - blobs:/var/lib/getafjob/blobs
    depends_on:
      migrate: { condition: service_completed_successfully }
      egress: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/getafjob", "healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
    networks: [edge, backend, gateway, proxy, observability]

  worker:
    <<: *hardening
    image: getafjob:dev
    pull_policy: never
    command: [worker]
    environment:
      <<: *app-env
      GETAFJOB_HEALTH_ADDR: ":8081"
      GETAFJOB_EGRESS_PROXY: http://egress:4750
      GETAFJOB_MASTER_KEY_FILE: /run/secrets/master_key
      GETAFJOB_BLOB_URL: file:///var/lib/getafjob/blobs
    secrets: [db_app_password, master_key]
    volumes:
      - blobs:/var/lib/getafjob/blobs
    depends_on:
      migrate: { condition: service_completed_successfully }
      egress: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/getafjob", "healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      start_interval: 1s
    networks: [backend, proxy, observability]

  runner:
    <<: *hardening
    image: getafjob-runner:dev
    build: { context: .., target: runner }
    command: [runner]
    environment:
      GETAFJOB_LOG_FORMAT: json
      GETAFJOB_LOG_LEVEL: ${GETAFJOB_LOG_LEVEL:-info}
      GETAFJOB_HEALTH_ADDR: ":8081"
      GETAFJOB_EGRESS_PROXY: http://egress:4750
      GETAFJOB_GATEWAY_URL: http://serve:8090
      GETAFJOB_RUNNER_SECRET_FILE: /run/secrets/runner_secret
    secrets: [runner_secret]
    # Chromium's own sandbox stays on: the seccomp profile allows user namespaces instead of --no-sandbox.
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp/chromium.json
    tmpfs:
      - /tmp:rw,size=512m,mode=1777
    shm_size: 256mb
    depends_on:
      egress: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/usr/local/bin/getafjob", "healthcheck", "http://127.0.0.1:8081/readyz"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      start_interval: 1s
    networks: [gateway, proxy]

  egress:
    <<: *hardening
    image: getafjob-egress:dev
    build: { context: .., target: egress }
    healthcheck:
      test: ["CMD", "/usr/local/bin/getafjob", "healthcheck", "tcp://127.0.0.1:4750"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      start_interval: 1s
    networks: [proxy, internet]

  # Development only (profile dev): catches all mail; web UI on http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    profiles: [dev]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend, devtools]

  caddy:
    <<: *hardening
    image: caddy:2.11.7-alpine@sha256:e70b164da81ef698b3ad19af799ea6086ce6d9e48ed4079eb9fe26f6fbf14ee5
    cap_add: [NET_BIND_SERVICE]
    environment:
      GETAFJOB_DOMAIN: ${GETAFJOB_DOMAIN:-localhost}
      GETAFJOB_TLS_MODE: ${GETAFJOB_TLS_MODE:-internal}
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      serve: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      start_interval: 1s
    networks: [edge, internet]

  # Observability profile: Prometheus, Tempo, Loki, Grafana and OpenTelemetry collector.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"
    networks: [observability]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [observability]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    networks: [observability]
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/var/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [observability]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [observability]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:3000:3000"
    networks: [observability]
    restart: unless-stopped

networks:
  internet: {}
  edge: { internal: true }
  backend: { internal: true }
  gateway: { internal: true }
  proxy: { internal: true }
  devtools: {}
  observability: { internal: true }

secrets:
  db_password:
    file: ${GETAFJOB_SECRETS_DIR:-./secrets}/db_password
  db_app_password:
    file: ${GETAFJOB_SECRETS_DIR:-./secrets}/db_app_password
  master_key:
    file: ${GETAFJOB_SECRETS_DIR:-./secrets}/master_key
  smtp_url:
    file: ${GETAFJOB_SECRETS_DIR:-./secrets}/smtp_url
  runner_secret:
    file: ${GETAFJOB_SECRETS_DIR:-./secrets}/runner_secret

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
  blobs: {}
  prometheus_data: {}
  tempo_data: {}
  loki_data: {}
  grafana_data: {}
